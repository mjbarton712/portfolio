name: Sync & Deploy Portfolio

on:
  # Manual "Sync now" button in the Actions tab
  workflow_dispatch:
  # Daily automatic sync (07:00 UTC)
  schedule:
    - cron: "0 7 * * *"
  # Redeploy on code changes
  push:
    branches: [main]

# Only one deploy at a time; let a fresh sync cancel an in-flight one
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write # commit refreshed data
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # The `secrets` context can't be used in a step `if`, so surface presence
    # of the PAT as a job-level env var the steps can gate on.
    env:
      HAS_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Pull latest repo + commit data from GitHub — ONLY when a PAT is set.
      # GH_SYNC_TOKEN must be a PAT with `repo` read scope to include PRIVATE
      # repos. Without it we skip the sync and build the committed data as-is,
      # so a token-less CI run never overwrites the full dataset with a
      # public-only one.
      - name: Sync from GitHub
        if: env.HAS_SYNC_TOKEN == 'true'
        env:
          GH_SYNC_TOKEN: ${{ secrets.GH_SYNC_TOKEN }}
        run: npm run sync

      # Persist the refreshed data so the "since last sync" diff works next time.
      - name: Commit refreshed data
        if: env.HAS_SYNC_TOKEN == 'true'
        run: |
          git config user.name "portfolio-bot"
          git config user.email "actions@github.com"
          git add src/data/portfolio.json
          git diff --cached --quiet || git commit -m "chore: sync portfolio data [skip ci]"
          git push || echo "nothing to push"

      - name: Build static site
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
